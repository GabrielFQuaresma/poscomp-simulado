name: CI

# deploy.yml so roda em push para main, entao sem isto nada valida um PR antes
# do merge: quebra de tipo ou de lint so apareceria no deploy, ja na main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
